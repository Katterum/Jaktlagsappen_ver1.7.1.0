<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const ORIGINAL=[[58.664119, 15.58811], [58.665739, 15.59701], [58.666249, 15.60909], [58.666209, 15.61882], [58.666959, 15.62172], [58.670439, 15.61868], [58.670919, 15.62506], [58.669999, 15.62916], [58.670079, 15.63205], [58.666648, 15.6383], [58.663199, 15.63769], [58.661059, 15.6405], [58.658569, 15.63929], [58.658329, 15.6434], [58.654019, 15.64771], [58.653609, 15.64317], [58.653929, 15.63898], [58.654999, 15.63563], [58.655919, 15.63259], [58.657489, 15.62833], [58.656599, 15.62407], [58.654929, 15.62153], [58.654079, 15.61704], [58.653579, 15.61134], [58.653679, 15.60571], [58.654589, 15.60198], [58.656259, 15.59886], [58.658849, 15.59643], [58.659859, 15.59217], [58.662269, 15.59027]],KEY='katterum-viltkarta-v074',old=JSON.parse(localStorage.getItem('katterum-viltkarta-v61')||'null'),state=JSON.parse(localStorage.getItem(KEY)||'null')||{boundary:ORIGINAL.map(x=>[...x]),observations:old?.observations||[]};let mode='',draft=[],savedBoundary=null,forecastPoint=null,forecastMarker=null,moveStart=null,windLayers=[];const deg={N:0,NO:45,O:90,SO:135,S:180,SV:225,V:270,NV:315};const map=L.map('map').setView([58.664,15.62],14);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);const obsLayer=L.layerGroup().addTo(map),workLayer=L.layerGroup().addTo(map);let boundary=L.polygon(state.boundary,{color:'#2583e8',weight:4,fillOpacity:.08}).addTo(map);map.fitBounds(boundary.getBounds(),{padding:[16,16]});function save(){localStorage.setItem(KEY,JSON.stringify(state))}function closeSheets(){document.querySelectorAll('.sheet').forEach(x=>x.classList.add('hidden'))}function inside(p){let v=state.boundary,h=false;for(let i=0,j=v.length-1;i<v.length;j=i++){let a=v[i],b=v[j];if(((a[0]>p.lat)!=(b[0]>p.lat))&&p.lng<(b[1]-a[1])*(p.lat-a[0])/(b[0]-a[0])+a[1])h=!h}return h}function startObs(){mode='obs';status.textContent='Tryck på observationsplatsen.'}function startTrack(){mode='track';draft=[];workLayer.clearLayers();trackActions.classList.remove('hidden');finishTrack.disabled=true;status.textContent='Tryck ut spåret punkt för punkt.'}function cancelTrack(){mode='';draft=[];workLayer.clearLayers();trackActions.classList.add('hidden')}function startForecast(){mode='forecast';status.textContent='Tryck exakt där du vill sitta.'}
map.on('click',e=>{if(!inside(e.latlng))return status.textContent='Välj en punkt innanför gränsen.';if(mode==='obs'){draft=[e.latlng];openObservation(false)}else if(mode==='track'){draft.push(e.latlng);drawTrack();finishTrack.disabled=draft.length<2}else if(mode==='forecast'){forecastPoint=e.latlng;if(forecastMarker)map.removeLayer(forecastMarker);forecastMarker=L.marker(e.latlng,{icon:L.divIcon({className:'seatPin',html:'⌖',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(map);pointText.textContent=`Vald punkt ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;forecastSheet.classList.remove('hidden');mode=''}});function drawTrack(){workLayer.clearLayers();L.polyline(draft,{color:'#ffc107',weight:5}).addTo(workLayer);draft.forEach(p=>L.marker(p,{icon:L.divIcon({className:'trackPoint',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(workLayer))}function openObservation(track){if(draft.length<(track?2:1))return;trackActions.classList.add('hidden');obsTitle.textContent=track?'Registrera viltspår':'Registrera observation';obsSheet.dataset.track=track?'1':'0';obsSheet.classList.remove('hidden')}function compass(a,b){let x=Math.atan2(b.lng-a.lng,b.lat-a.lat)*180/Math.PI;if(x<0)x+=360;return ['N','NO','O','SO','S','SV','V','NV'][Math.round(x/45)%8]}function saveObs(){let tr=obsSheet.dataset.track==='1',o={id:crypto.randomUUID(),lat:draft[0].lat,lng:draft[0].lng,track:tr?draft.map(p=>[p.lat,p.lng]):[],species:species.value,count:+count.value||1,date:date.value,time:time.value,direction:tr?compass(draft[0],draft.at(-1)):direction.value,activity:activity.value,windDir:windDir.value,windSpeed:+windSpeed.value||0,comment:comment.value};state.observations.push(o);save();mode='';draft=[];workLayer.clearLayers();closeSheets();render();status.textContent='Sparat i gemensam viltrapportering.'}
function openBoundary(){savedBoundary=state.boundary.map(x=>[...x]);mode='boundary';drawHandles();boundarySheet.classList.remove('hidden')}function polygonCenter(){let a=state.boundary.reduce((n,p)=>[n[0]+p[0],n[1]+p[1]],[0,0]);return [a[0]/state.boundary.length,a[1]/state.boundary.length]}function drawHandles(){workLayer.clearLayers();state.boundary.forEach((p,i)=>{let h=L.marker(p,{draggable:true,icon:L.divIcon({className:'boundaryHandle',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(workLayer);h.on('drag',e=>{let q=e.target.getLatLng();state.boundary[i]=[q.lat,q.lng];boundary.setLatLngs(state.boundary)});h.on('dragend',()=>drawHandles())});let c=polygonCenter(),start=null,original=null,center=L.marker(c,{draggable:true,zIndexOffset:1000,icon:L.divIcon({className:'centerHandle',iconSize:[28,28],iconAnchor:[14,14]})}).bindTooltip('Flytta hela området',{permanent:true,direction:'top',className:'centerLabel'}).addTo(workLayer);center.on('dragstart',e=>{start=e.target.getLatLng();original=state.boundary.map(p=>[...p])});center.on('drag',e=>{let q=e.target.getLatLng(),da=q.lat-start.lat,dl=q.lng-start.lng;state.boundary=original.map(p=>[p[0]+da,p[1]+dl]);boundary.setLatLngs(state.boundary)});center.on('dragend',()=>{status.textContent='Hela området flyttades. Tryck Spara för att behålla läget.';drawHandles()})}function saveBoundary(){save();workLayer.clearLayers();closeSheets();mode='';status.textContent='Gränsen sparad.'}function cancelBoundary(){if(savedBoundary)state.boundary=savedBoundary;boundary.setLatLngs(state.boundary);workLayer.clearLayers();closeSheets();mode=''}function resetBoundary(){state.boundary=ORIGINAL.map(x=>[...x]);boundary.setLatLngs(state.boundary);drawHandles();map.fitBounds(boundary.getBounds())}
async function getForecast(){let iso=fDate.value+'T'+fTime.value,weather='<b>Väder kunde inte hämtas.</b>',wd=null,ws=0;try{let u=`https://api.open-meteo.com/v1/forecast?latitude=${forecastPoint.lat}&longitude=${forecastPoint.lng}&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,precipitation_probability&wind_speed_unit=ms&timezone=Europe%2FStockholm&forecast_days=16`,j=await(await fetch(u)).json(),i=j.hourly.time.indexOf(iso);if(i<0)i=0;wd=j.hourly.wind_direction_10m[i];ws=j.hourly.wind_speed_10m[i];weather=`<h3>Väder vid sittplatsen</h3><div class="weatherGrid"><div>Vind från<br><b>${dirName(wd)} ${Math.round(wd)}°</b></div><div>Vindstyrka<br><b>${ws.toFixed(1)} m/s</b></div><div>Temperatur<br><b>${j.hourly.temperature_2m[i].toFixed(1)} °C</b></div><div>Nederbördsrisk<br><b>${j.hourly.precipitation_probability[i]}%</b></div></div>`;drawWind(wd,ws)}catch(e){}let h=+fTime.value.split(':')[0],species=['Dovhjort','Älg','Kronhjort','Rådjur','Vildsvin'],rows=species.map(sp=>{let a=state.observations.filter(o=>o.species===sp),score=a.reduce((n,o)=>{let km=dist(forecastPoint.lat,forecastPoint.lng,o.lat,o.lng),oh=+(o.time||'12:00').split(':')[0];return n+Math.max(0,1-km/3)*Math.max(0,1-Math.abs(oh-h)/8)*Math.sqrt(o.count||1)},0);return{sp,score,count:a.length}}),sum=rows.reduce((n,x)=>n+x.score,0);infoContent.innerHTML=weather+'<h3>Djursannolikhet</h3>'+rows.sort((a,b)=>b.score-a.score).map(x=>{let p=sum?Math.round(x.score/sum*100):0;return `<div class="rank"><span>${x.sp}<small> · ${x.count} obs</small><div class="bar"><i style="width:${p}%"></i></div></span><b>${p}%</b></div>`}).join('');closeSheets();infoPanel.classList.remove('hidden');let px=map.project(forecastPoint,map.getZoom()).add([0,160]);map.panTo(map.unproject(px,map.getZoom()))}function dirName(d){return ['N','NO','O','SO','S','SV','V','NV'][Math.round(d/45)%8]}function drawWind(wd,ws){windLayers.forEach(x=>map.removeLayer(x));windLayers=[];let flow=(wd+180)*Math.PI/180,cos=Math.cos(forecastPoint.lat*Math.PI/180),earth=111320,len=135+Math.min(120,ws*10),spread=12.5*Math.PI/180,perp=flow+Math.PI/2;[-1,0,1].forEach(side=>{let ang=flow+side*spread,olat=forecastPoint.lat+Math.cos(perp)*side*5/earth,olng=forecastPoint.lng+Math.sin(perp)*side*5/earth/cos,pts=[];for(let i=0;i<=28;i++){let t=i/28,wave=Math.sin(t*Math.PI*2+side)*2.5*(1-t)/earth,lat=olat+Math.cos(ang)*len*t/earth+Math.cos(perp)*wave,lng=olng+(Math.sin(ang)*len*t/earth+Math.sin(perp)*wave)/cos;pts.push([lat,lng])}let under=L.polyline(pts,{color:'#ffffff',weight:side?5:9,opacity:.48,lineCap:'round',lineJoin:'round'}).addTo(map),line=L.polyline(pts,{color:side?'#77d6ff':'#159fdf',weight:side?2.5:5.5,opacity:side?.72:.9,lineCap:'round',lineJoin:'round'}).addTo(map);windLayers.push(under,line)})}function dist(a,b,c,d){let r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)*r/2),y=(c-a)*r;return 6371*Math.sqrt(x*x+y*y)}function render(){obsLayer.clearLayers();state.observations.forEach(o=>{L.circleMarker([o.lat,o.lng],{radius:9,color:'#fff',fillColor:'#7b4',fillOpacity:1}).bindPopup(`<b>${o.species} ${o.count} st</b>`).addTo(obsLayer);if(o.track?.length>1)L.polyline(o.track,{color:'#ffc107',weight:4}).addTo(obsLayer)})}let n=new Date();date.value=fDate.value=n.toISOString().slice(0,10);time.value=fTime.value=n.toTimeString().slice(0,5);render();
